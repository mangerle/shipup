name: CI 质量门禁与跨平台验证

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: 代码风格格式化检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 执行代码格式化检查 (cargo fmt)
        run: cargo fmt --all --check

  clippy:
    name: 静态代码分析检查 (Clippy 零警告)
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo 依赖与编译产物
        uses: Swatinem/rust-cache@v2

      - name: 运行 Clippy 零警告门禁检查
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: 跨平台功能与单元测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖与编译产物
        uses: Swatinem/rust-cache@v2

      - name: 执行全工作区全特性测试
        run: cargo test --all-targets --all-features --verbose

  audit:
    name: 依赖安全漏洞审计 (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 运行依赖安全漏洞扫描
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: 最低支持 Rust 版本编译门禁 (MSRV 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 MSRV 工具链 (1.96.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: 缓存 Cargo 依赖与编译产物
        uses: Swatinem/rust-cache@v2

      - name: 验证 MSRV 工具链编译与特性兼容性
        run: cargo check --all-targets --all-features

  coverage:
    name: 代码覆盖率收集与统计 (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链及 LLVM 预览工具
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: 缓存 Cargo 依赖与编译产物
        uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-llvm-cov 工具
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 执行代码覆盖率测试并导出 LCOV 报告
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info


