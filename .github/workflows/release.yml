name: 自动化版本发布与构建分发

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: 发布至 crates.io
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 发布核心库 shipup 至 crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shipup

      - name: 等待 crates.io 索引完成同步收录
        run: sleep 30

      - name: 发布发布端工具 shipup-cli 至 crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shipup-cli

  build-cli:
    name: 交叉编译发布端二进制 (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: shipup-cli.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: shipup-cli
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: shipup-cli
            archive_ext: tar.gz
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链与目标架构
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 编译优化二进制 (Release)
        run: cargo build -p shipup-cli --release --target ${{ matrix.target }}

      - name: 打包 Windows 压缩文件 (.zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $archive = "shipup-cli-${ver}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath $archive
          Get-FileHash -Algorithm SHA256 $archive | Out-File -FilePath "$archive.sha256"

      - name: 打包 Unix 归档文件 (.tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          ver="${{ github.ref_name }}"
          archive="shipup-cli-${ver}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
          sha256sum "$archive" > "$archive.sha256"

      - name: 归档上传发布资产临时工件
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            shipup-cli-*-${{ matrix.target }}.*

  create-release:
    name: 创建 GitHub Release 页面并分发资产
    needs: [publish-crates, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整代码历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 基于 Commit 生成分类 Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - name: 下载各平台打包产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: 创建 GitHub Release 并发布 Changelog 与资产
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_CHANGELOG.md
          files: dist-artifacts/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
