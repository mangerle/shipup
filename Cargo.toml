[workspace]
resolver = "3"
members = [
    "shipup",
    "shipup-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["wangle"]
license = "MIT"
repository = "https://github.com/mangerle/shipup"
homepage = "https://github.com/mangerle/shipup"
documentation = "https://docs.rs/shipup"
readme = "README.md"
rust-version = "1.96.0"
description = "通用、轻量级、无 UI 绑定的跨平台软件自更新系统"
keywords = ["updater", "self-update", "cross-platform", "desktop", "auto-update"]
categories = ["development-tools", "os"]

[workspace.dependencies]
# 内部子包统一声明
shipup = { path = "shipup", default-features = false }

# 网络与异步
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1.38", default-features = false }
futures-util = { version = "0.3", default-features = false }

# 核心系统与文件替换
self-replace = "1.5"

# 加密与哈希校验
ed25519-dalek = { version = "2.1", default-features = false }
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["std"] }

# 序列化与版本
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }

# 错误处理与日志门面
thiserror = "2.0"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }

# 归档解压缩
zip = { version = "2.2", default-features = false }
flate2 = "1.0"
tar = "0.4"

# 生产发布体积与性能优化
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
