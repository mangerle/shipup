[workspace]
resolver = "3"
members = [
    "shipup",
    "shipup-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["wangle"]
license = "MIT"
repository = "https://github.com/mangerle/shipup"
homepage = "https://github.com/mangerle/shipup"
documentation = "https://docs.rs/shipup"
readme = "README.md"
rust-version = "1.96.0"
description = "A universal, lightweight, UI-independent cross-platform software auto-update system"
keywords = ["updater", "self-update", "cross-platform", "desktop", "auto-update"]
categories = ["development-tools", "os"]

[workspace.dependencies]
# 内部子包统一声明
shipup = { path = "shipup", version = "0.2.0", default-features = false }

# 网络与异步
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1.53", default-features = false }
futures-util = { version = "0.3.34", default-features = false }

# 核心系统与文件替换
self-replace = "1.5.0"

# 加密与哈希校验
ed25519-dalek = { version = "3.0", default-features = false }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

# 序列化与版本
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = { version = "1.0.28", features = ["serde"] }

# 错误处理与日志门面
thiserror = "2.0.20"
log = "0.4.34"
clap = { version = "4.6", features = ["derive"] }

# 归档解压缩
zip = { version = "8.6", default-features = false }
flate2 = "1.1"
tar = "0.4.46"

# 生产发布体积与性能优化
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
