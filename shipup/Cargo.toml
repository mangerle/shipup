[package]
name = "shipup"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = [
    "blocking",
    "async",
    "default-tls",
    "archive",
]
blocking = ["dep:reqwest", "reqwest/blocking"]
async = [
    "dep:reqwest",
    "reqwest/stream",
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/fs",
    "tokio/io-util",
    "dep:futures-util",
    "futures-util/io",
]
default-tls = ["dep:reqwest", "reqwest/default-tls"]
rustls-tls = ["dep:reqwest", "reqwest/rustls"]
rustls = ["rustls-tls"]

# 归档特性按需解耦：default 仅包含高频通用的 zip 与 tar.gz，小众重型依赖（zstd, xz）按需开启
archive = ["archive-zip", "archive-tar"]
archive-all = ["archive", "archive-tar-zst", "archive-tar-xz"]
archive-zip = ["dep:zip", "zip/deflate"]
archive-tar = ["dep:flate2", "dep:tar"]
archive-tar-zst = ["dep:ruzstd", "dep:tar"]
archive-tar-xz = ["dep:lzma-rs", "dep:tar"]

[dependencies]
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

self-replace = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

zip = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
