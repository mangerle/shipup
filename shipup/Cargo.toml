[package]
name = "shipup"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["blocking", "async", "archive-zip", "archive-tar", "archive-tar-zst", "archive-tar-xz"]
blocking = ["dep:reqwest", "reqwest/blocking", "reqwest/default-tls"]
async = [
    "dep:reqwest",
    "reqwest/default-tls",
    "reqwest/stream",
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/fs",
    "tokio/io-util",
    "dep:futures-util",
    "futures-util/io",
]
archive-zip = ["dep:zip", "zip/deflate"]
archive-tar = ["dep:flate2", "dep:tar"]
archive-tar-zst = ["dep:ruzstd", "dep:tar"]
archive-tar-xz = ["dep:lzma-rs", "dep:tar"]

[dependencies]
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

self-replace = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

zip = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
